name: Deploy to Azure

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  AZURE_WEBAPP_NAME: todo-app
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '24'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Azure secrets
        run: |
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -z "${{ secrets.AZURE_TENANT_ID }}" ] || [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] || [ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]; then
            echo "::error::Azure secrets are not configured. Please configure AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, and AZURE_SUBSCRIPTION_ID in repository secrets."
            echo "::error::Go to: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - name: Login to Azure
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set deployment environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Set resource group name
        id: set-rg
        run: |
          ENV="${{ steps.set-env.outputs.environment }}"
          echo "resourceGroup=todo-app-rg-${ENV}" >> $GITHUB_OUTPUT

      - name: Create resource group
        id: set-region
        run: |
          az group create --name ${{ steps.set-rg.outputs.resourceGroup }} --location eastus || true
          echo "region=eastus" >> $GITHUB_OUTPUT

      - name: Deploy Bicep template
        run: |
          cd infrastructure
          az deployment group create \
            --resource-group ${{ steps.set-rg.outputs.resourceGroup }} \
            --template-file main.bicep \
            --parameters appName='todo-app' \
            --parameters environment='${{ steps.set-env.outputs.environment }}' \
            --parameters location='${{ steps.set-region.outputs.region }}' \
            --parameters sqlAdminUsername='todoadmin' \
            --parameters sqlAutoPauseDelay=60 \
            --parameters sqlAdminPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}"

      - name: Get Container Registry name
        id: get-acr
        run: |
          RG="${{ steps.set-rg.outputs.resourceGroup }}"
          ACR_NAME=$(az acr list --resource-group $RG --query "[0].name" -o tsv)
          echo "acrName=${ACR_NAME}" >> $GITHUB_OUTPUT

      - name: Get SQL connection string
        id: get-sql-conn
        run: |
          RG="${{ steps.set-rg.outputs.resourceGroup }}"
          SQL_SERVER=$(az sql server list --resource-group $RG --query "[0].name" -o tsv)
          SQL_DB=$(az sql db list --resource-group $RG --server $SQL_SERVER --query "[0].name" -o tsv)
          SQL_USER="${{ secrets.AZURE_SQL_ADMIN_USERNAME }}"
          SQL_PASS="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}"
          CONN_STRING="Server=tcp:${SQL_SERVER}.database.windows.net,1433;Initial Catalog=${SQL_DB};Persist Security Info=False;User ID=${SQL_USER};Password=${SQL_PASS};MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          echo "connectionString=${CONN_STRING}" >> $GITHUB_OUTPUT

      - name: Wait for role assignment propagation
        run: |
          echo "Waiting for managed identity role assignment to propagate..."
          sleep 30

      - name: Update Container App secrets and environment
        run: |
          RG="${{ steps.set-rg.outputs.resourceGroup }}"
          ENV="${{ steps.set-env.outputs.environment }}"
          BACKEND_APP="todo-app-api-${ENV}"
          # Set the secret first
          az containerapp secret set \
            --name $BACKEND_APP \
            --resource-group $RG \
            --secrets sql-connection-string="${{ steps.get-sql-conn.outputs.connectionString }}" || echo "Secret may already exist"
          # Update the environment variable to use the secret
          az containerapp update \
            --name $BACKEND_APP \
            --resource-group $RG \
            --set-env-vars ConnectionStrings__TodoDb="secretref:sql-connection-string" || true

      - name: Get frontend URL and update backend CORS
        id: update-cors
        run: |
          RG="${{ steps.set-rg.outputs.resourceGroup }}"
          ENV="${{ steps.set-env.outputs.environment }}"
          FRONTEND_URL=$(az containerapp show --name todo-app-web-${ENV} --resource-group $RG --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "frontendUrl=https://${FRONTEND_URL}" >> $GITHUB_OUTPUT
          az containerapp update \
            --name todo-app-api-${ENV} \
            --resource-group $RG \
            --set-env-vars Frontend__Origin="https://${FRONTEND_URL}"

    outputs:
      acrName: ${{ steps.get-acr.outputs.acrName }}
      resourceGroup: ${{ steps.set-rg.outputs.resourceGroup }}
      environment: ${{ steps.set-env.outputs.environment }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Login to Azure
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ needs.deploy-infrastructure.outputs.acrName }}

      - name: Build and push backend image
        run: |
          docker build -f backend/Todo.Api/Dockerfile -t ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-api:${{ github.sha }} -t ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-api:latest .
          docker push ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-api:${{ github.sha }}
          docker push ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-api:latest

      - name: Build and push frontend image
        run: |
          docker build -f frontend/Dockerfile -t ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-frontend:${{ github.sha }} -t ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-frontend:latest .
          docker push ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-frontend:${{ github.sha }}
          docker push ${{ needs.deploy-infrastructure.outputs.acrName }}.azurecr.io/todo-frontend:latest

  update-container-apps:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-push]
    permissions:
      contents: read

    steps:
      - name: Login to Azure
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_CLIENT_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart Container Apps to pick up new images
        run: |
          RG="${{ needs.deploy-infrastructure.outputs.resourceGroup }}"
          ENV="${{ needs.deploy-infrastructure.outputs.environment }}"
          ACR_NAME="${{ needs.deploy-infrastructure.outputs.acrName }}"
          BACKEND_IMAGE="${ACR_NAME}.azurecr.io/todo-api:latest"
          FRONTEND_IMAGE="${ACR_NAME}.azurecr.io/todo-frontend:latest"
          az containerapp update \
            --name todo-app-api-${ENV} \
            --resource-group $RG \
            --image $BACKEND_IMAGE || true
          az containerapp update \
            --name todo-app-web-${ENV} \
            --resource-group $RG \
            --image $FRONTEND_IMAGE || true

      - name: Output deployment URLs
        run: |
          RG="${{ needs.deploy-infrastructure.outputs.resourceGroup }}"
          ENV="${{ needs.deploy-infrastructure.outputs.environment }}"
          BACKEND_URL=$(az containerapp show --name todo-app-api-${ENV} --resource-group $RG --query "properties.configuration.ingress.fqdn" -o tsv)
          FRONTEND_URL=$(az containerapp show --name todo-app-web-${ENV} --resource-group $RG --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "::notice::Backend URL: https://${BACKEND_URL}"
          echo "::notice::Frontend URL: https://${FRONTEND_URL}"
          echo "Backend URL: https://${BACKEND_URL}" >> $GITHUB_STEP_SUMMARY
          echo "Frontend URL: https://${FRONTEND_URL}" >> $GITHUB_STEP_SUMMARY
